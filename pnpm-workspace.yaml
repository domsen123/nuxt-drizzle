  '@nuxtjs/seo': ^5.3.14
  '@pinia/colada': ^1.4.2
  '@pinia/colada-nuxt': ^1.0.2
  '@pinia/nuxt': ^1.0.2
  '@standard-schema/spec': ^1.1.0
  '@types/bcrypt': ^6.0.0
  '@types/nodemailer': ^8.0.1
  '@vue/test-utils': ^2.5.0
  '@vueuse/nuxt': ^14.4.0
  '@vueuse/router': ^14.4.0
  ai: ^7.0.84
  bcrypt: ^6.0.0
  better-sqlite3: ^13.0.3
  date-fns: ^4.4.0
  dotenv: ^17.4.2
  dotenv-cli: ^11.0.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^10.9.1
  happy-dom: ^20.11.13
  hookable: ^6.1.1
  liquidjs: ^10.29.0
  mitt: ^3.0.1
  nodemailer: ^9.0.6
  nuxt: ^4.5.2
  nuxt-mcp-dev: ^0.3.2
  nuxt-og-image: ^6.7.8
  pinia: ^4.0.3
  playwright-core: ^1.62.1
  postgres: ^3.4.9
  sharp: ^0.35.4
  tsx: ^4.23.12
  # TypeScript 7 is out, but vue-tsc 3.3.11 still requires typescript/lib/tsc,
  # which 7.0 no longer exports, and typescript-eslint 8.68 caps at <6.1.0.
  # Move to 7 once both support it.
  typescript: ~6.0.3
  ulid: ^3.0.2
  undici: ^8.10.0
  vitest: ^4.1.11
  vue-advanced-cropper: ^2.8.9
  vue-tsc: ^3.3.11
  zod: ^4.5.1

catalogMode: prefer

onlyBuiltDependencies:
  - '@parcel/watcher'
  - bcrypt
  - better-sqlite3
  - esbuild
  - sharp
  - vue-demi

shellEmulator: true

# nuxt-og-image 6.7.8 still declares sharp ^0.34.0. It only calls
# sharp(buffer, options).jpeg(options).toBuffer(), which is unchanged in 0.35.
# Drop the rule once nuxt-og-image widens its peer range.
peerDependencyRules:
  allowedVersions:
    nuxt-og-image>sharp: '0.35'
