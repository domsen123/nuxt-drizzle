services:
  postgres-test:
    image: postgres:18
    container_name: cockpit-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NUXT_DATABASE_NAME:-nuxt-drizzl-test}
      POSTGRES_USER: ${NUXT_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${NUXT_DATABASE_PASSWORD:-postgres}
    ports:
      - '${NUXT_DATABASE_PORT:-5460}:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${NUXT_DATABASE_USER:-postgres} -d ${NUXT_DATABASE_NAME:-nuxt-drizzl-test}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_test_data:
